<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 359 64" width="359" height="64" fill="none">
  <defs>
    <!-- Liquid Frosted Glass Capsule Background Gradient -->
    <linearGradient id="glassBg" x1="0" y1="0" x2="359" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#040920" stop-opacity="0.95" />
      <stop offset="45%" stop-color="#0e1844" stop-opacity="0.80" />
      <stop offset="100%" stop-color="#020516" stop-opacity="0.96" />
    </linearGradient>

    <!-- Frosted Glass Rim Border Gradient -->
    <linearGradient id="glassRim" x1="180" y1="0" x2="180" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.65" />
      <stop offset="30%" stop-color="#FFFFFF" stop-opacity="0.20" />
      <stop offset="70%" stop-color="#0047FF" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#0047FF" stop-opacity="0.55" />
    </linearGradient>

    <!-- Top Specular Curved Lens Light Reflection -->
    <linearGradient id="topSpecular" x1="32" y1="0" x2="327" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0" />
      <stop offset="18%" stop-color="#FFFFFF" stop-opacity="0.5" />
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.95" />
      <stop offset="82%" stop-color="#FFFFFF" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>

    <!-- Star Core Luminous Glow -->
    <radialGradient id="starGlow" cx="307" cy="32" r="26" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7075F7" stop-opacity="0.5" />
      <stop offset="60%" stop-color="#7075F7" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#7075F7" stop-opacity="0" />
    </radialGradient>

    <!-- Star Filter Bloom -->
    <filter id="bloom" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="1.2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Frosted Glass Capsule Base -->
  <rect x="0.5" y="0.5" width="358" height="63" rx="31.5" fill="url(#glassBg)" stroke="url(#glassRim)" stroke-width="1" />

  <!-- Top Specular Curved Light Arc -->
  <path d="M 32,2 Q 180,1 327,2" stroke="url(#topSpecular)" stroke-width="1.2" stroke-linecap="round" fill="none" />

  <!-- Star Ambient Glow -->
  <circle cx="307" cy="32" r="26" fill="url(#starGlow)" />

